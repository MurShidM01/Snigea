name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# The pipeline only reads the repository. Signing secrets are never available
# to a pull request from a fork.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.7"

jobs:
  pull-request-rules:
    name: Check the rules of the pull request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The rules only exist for a pull request, a push to a branch is checked
    # by the quality job below.
    if: github.event_name == 'pull_request'
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate the branch, the title and the body
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bash tool/check_pull_request.sh

  quality:
    name: Format, analyse and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install the dependencies
        run: flutter pub get

      - name: Check the formatting
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Analyse the project
        run: flutter analyze --no-fatal-infos

      - name: Run the tests
        run: flutter test --reporter expanded 2>&1 | tee test-output.log

      - name: Upload the test log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-output
          path: test-output.log
          if-no-files-found: ignore
          retention-days: 7

  build-web:
    name: Build the web application
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install the dependencies
        run: flutter pub get

      - name: Build the production web bundle
        run: flutter build web --release

      - name: Check the bundle
        run: |
          test -f build/web/index.html
          test -f build/web/main.dart.js
          test -f build/web/assets/assets/sqlite3.wasm
          test -f build/web/assets/assets/drift_worker.js
          test -f build/web/assets/assets/icon/snigea_logo.png

  build-android:
    name: Build the Android release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The repository asks for a large Gradle heap. The hosted runner has
      # enough memory, the cap keeps the build inside the available budget.
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install the dependencies
        run: flutter pub get

      # Only release builds are produced. The Gradle configuration falls back
      # to the debug signing identity when android/key.properties is missing,
      # so the pull request build needs no secret and produces a release APK.
      - name: Build the release APK
        run: flutter build apk --release

      - name: Upload the release APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: snigea-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
