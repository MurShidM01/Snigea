<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <meta name="theme-color" content="#09090B">
  <meta name="color-scheme" content="dark light">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Snigea">
  <meta property="og:title" content="Snigea — open source movie and TV streaming client">
  <meta property="og:description" content="Stream movies and series from MovieBox, 4KHDHub, Dramachi, BDIX and Stremio addons. Built with Flutter, with an embedded player, downloads and a local library.">
  <meta property="og:image" content="icons/Icon-512.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Snigea — open source movie and TV streaming client">
  <meta name="twitter:description" content="Stream movies and series from MovieBox, 4KHDHub, Dramachi, BDIX and Stremio addons. Built with Flutter.">
  <meta name="twitter:image" content="icons/Icon-512.png">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Snigea — open source movie and TV streaming client</title>
  <link rel="manifest" href="manifest.json">
</head>
